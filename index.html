<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/avatar-komkrit.png" />
    <title>คมคิด by KOMKRIT | คิดต่างอย่างสร้างสรรค์ — บทความ ความรู้ AI & การศึกษา</title>
    <script>
      (function () {
        var fontCssUrl =
          'https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Sriracha&display=swap';
        if (typeof window !== 'undefined' && typeof window.fetch === 'function') {
          window
            .fetch(fontCssUrl, { mode: 'cors', credentials: 'omit' })
            .then(function (res) {
              return res.ok ? res.text() : '';
            })
            .then(function (cssText) {
              if (!cssText) return;
              var style = document.createElement('style');
              style.id = 'komkid-google-fonts';
              style.textContent = cssText;
              document.head.appendChild(style);
            })
            .catch(function () {
              /* Fallback to native Thai system fonts when offline or restricted */
            });
        }
      })();
    </script>
  </head>
  <body class="bg-[#f4f7fb] text-[#0f294a] antialiased selection:bg-[#f59e0b]/25 selection:text-[#0f294a]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

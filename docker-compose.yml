services:
  aiflow:
    container_name: komkid-aiflow-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:8080"
    networks:
      - default
      - coolify
    labels:
      - "coolify.managed=true"
      - "coolify.version=4.6.0"
      - "coolify.applicationId=1"
      - "coolify.type=application"
      - "coolify.name=komkid-aiflow-app"
      - "coolify.projectName=komkid-by-komkrit-aiflow"
      - "coolify.serviceName=aiflow"
      - "coolify.environmentName=production"
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.komkid-aiflow-http.rule=Host(`5.183.33.183.sslip.io`) || Host(`5.183.33.183`) || Host(`komkid.in.th`) || Host(`www.komkid.in.th`) || Host(`api.komkid.in.th`)"
      - "traefik.http.routers.komkid-aiflow-http.entrypoints=http"
      - "traefik.http.routers.komkid-aiflow-http.service=komkid-aiflow-svc"
      - "traefik.http.routers.komkid-aiflow-https.rule=Host(`komkid.in.th`) || Host(`www.komkid.in.th`) || Host(`api.komkid.in.th`) || Host(`5.183.33.183.sslip.io`)"
      - "traefik.http.routers.komkid-aiflow-https.entrypoints=https"
      - "traefik.http.routers.komkid-aiflow-https.tls=true"
      - "traefik.http.routers.komkid-aiflow-https.service=komkid-aiflow-svc"
      - "traefik.http.services.komkid-aiflow-svc.loadbalancer.server.port=8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/uploads
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - FAL_KEY=${FAL_KEY:-}
      - RUNWAY_API_KEY=${RUNWAY_API_KEY:-}
      - LUMA_API_KEY=${LUMA_API_KEY:-}
      - KLING_API_KEY=${KLING_API_KEY:-}
      - HEYGEN_API_KEY=${HEYGEN_API_KEY:-}
      - SUNO_API_KEY=${SUNO_API_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
    volumes:
      - komkid_aiflow_data:/app/data
      - komkid_aiflow_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  komkid_aiflow_data:
    name: komkid_aiflow_data
  komkid_aiflow_uploads:
    name: komkid_aiflow_uploads

networks:
  coolify:
    external: true
